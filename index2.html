<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSD Lingo Yarışması</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root {
  /* HSD theme: a bright stage in Huawei red, white and graphite.
     Layout: team cards left, the board card centre, host console right.
     Signature: the flipping letter tile; red marks a correct letter, so red is kept for wins and primary actions. */
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eceef2;
  --ink: #17191e;
  --ink-2: #2b2f36;
  --muted: #5d6370;
  --faint: #9aa0ab;
  --line: #e2e5ea;
  --line-2: #cfd4dc;
  --red: #c7000b;
  --red-2: #e3101c;
  --red-soft: #fdeced;
  --near: #ffc21a;
  --near-ink: #3a2a00;
  --gold: #f2a900;
  --ok: #059669;
  --shadow-1: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 8px rgba(16, 24, 40, .06);
  --shadow-2: 0 2px 6px rgba(16, 24, 40, .05), 0 14px 36px rgba(16, 24, 40, .09);
  --shadow-3: 0 30px 80px rgba(16, 24, 40, .24);
  --font-display: 'Lexend', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Onest', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --g-tile: linear-gradient(180deg, #3b404a 0%, #2a2e36 100%);
  --g-off: linear-gradient(180deg, #e6e9ee 0%, #d7dbe2 100%);
  --off-ink: #69707d;
  --g-hit: linear-gradient(180deg, #ec1c27 0%, #c7000b 58%, #a8000a 100%);
  --g-near: linear-gradient(180deg, #ffd84d 0%, #ffc21a 58%, #eca800 100%);
  --flip-dur: 460ms;
  --flip-step: 250ms;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; left: 0; right: 0; top: 0; height: 4px; z-index: 30; pointer-events: none;
  background: linear-gradient(90deg, var(--red) 0%, var(--red-2) 55%, var(--red) 100%);
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 3px solid rgba(199, 0, 11, .5); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- Backdrop ---------- */
.stage-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(46% 42% at 100% 0%, rgba(199, 0, 11, .11) 0%, rgba(199, 0, 11, 0) 100%),
    radial-gradient(40% 40% at 0% 100%, rgba(199, 0, 11, .07) 0%, rgba(199, 0, 11, 0) 100%),
    radial-gradient(circle at 1px 1px, rgba(23, 25, 30, .08) 1px, rgba(23, 25, 30, 0) 1.6px) 0 0 / 22px 22px,
    var(--bg);
}

#app { position: relative; z-index: 1; height: 100%; }
.view { height: 100%; overflow: auto; }
.view.enter { animation: view-in .35s ease both; }
@keyframes view-in { from { opacity: .001; } to { opacity: 1; } }

/* ---------- Buttons & small parts ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  padding: .62em 1.05em; border-radius: 12px; border: 1px solid var(--line-2);
  background: #fff; color: var(--ink); font-weight: 600; font-size: 15px; line-height: 1.1;
  cursor: pointer; white-space: nowrap; text-decoration: none;
  box-shadow: 0 1px 2px rgba(16, 24, 40, .06);
  transition: background .18s, border-color .18s, transform .12s, box-shadow .18s, opacity .18s, color .18s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: #b5bcc7; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }
.btn .ico { flex: none; }
.btn-primary {
  background: linear-gradient(180deg, var(--red-2), var(--red)); border-color: transparent; color: #fff; font-weight: 700;
  box-shadow: 0 6px 18px rgba(199, 0, 11, .26), inset 0 1px 0 rgba(255, 255, 255, .2);
}
.btn-primary:hover:not(:disabled) { background: linear-gradient(180deg, #f2232e, #d3000c); border-color: transparent; box-shadow: 0 8px 24px rgba(199, 0, 11, .34), inset 0 1px 0 rgba(255, 255, 255, .2); }
.btn-danger { background: #fff; border-color: rgba(199, 0, 11, .38); color: var(--red); }
.btn-danger:hover:not(:disabled) { background: var(--red-soft); border-color: rgba(199, 0, 11, .6); }
.btn-ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-3); border-color: transparent; color: var(--ink); }
.btn-lg { font-size: 18px; padding: .8em 1.35em; border-radius: 14px; }
.btn-sm { font-size: 13px; padding: .45em .7em; border-radius: 9px; }
.btn-icon { padding: 0; width: 38px; height: 38px; }
.btn-icon.btn-sm { width: 30px; height: 30px; }
.btn-note { font-weight: 500; font-size: 13px; opacity: .85; }
.btn .kbd { margin-left: .2em; }
.link { background: none; border: 0; padding: 0; color: var(--red); text-decoration: underline; cursor: pointer; font-weight: 600; }
.kbd {
  display: inline-grid; place-items: center; min-width: 1.65em; height: 1.65em; padding: 0 .4em;
  border-radius: 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: #fff;
  font: 700 .76em/1 var(--font-body); color: var(--ink-2); vertical-align: .05em;
}
.btn-primary .kbd { border-color: rgba(255, 255, 255, .5); background: rgba(255, 255, 255, .14); color: #fff; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.notice { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; margin: 0 0 14px; font-size: 14px; box-shadow: var(--shadow-1); }
.notice.warn { border-color: #f0c870; background: #fff8e6; }
.notice.info { border-color: #bcd0f5; background: #f1f6ff; }
.notice ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- Tiles ---------- */
.tile {
  position: relative; flex: none; width: var(--ts, 56px); height: var(--ts, 56px);
  border-radius: calc(var(--ts, 56px) * .16); display: grid; place-items: center;
  background: var(--g-tile); color: #fff;
  font-family: var(--font-display); font-weight: 700; font-size: calc(var(--ts, 56px) * .48); line-height: 1;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -3px 0 rgba(0, 0, 0, .3), 0 4px 10px rgba(23, 25, 30, .14);
  user-select: none;
}
.tile > b { position: relative; z-index: 1; font-weight: inherit; }
.tile.is-empty { background: var(--surface-3); box-shadow: inset 0 0 0 1px rgba(23, 25, 30, .05); }
.tile.slot, .tile.is-ghost { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--line-2), 0 2px 6px rgba(23, 25, 30, .05); }
.tile.is-ghost > b { color: #a9afb9; }
.tile.is-hint { box-shadow: inset 0 0 0 3px var(--red), 0 0 0 4px rgba(199, 0, 11, .12), 0 6px 16px rgba(199, 0, 11, .2); }
.tile.is-hint > b { color: var(--red); }
.tile.is-typed { animation: tile-pop .16s ease-out; }
.tile.hit { background: var(--g-hit); color: #fff; }
.tile.near { background: var(--g-near); color: var(--near-ink); }
.tile.miss {
  background: var(--g-off); color: var(--off-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), inset 0 -3px 0 rgba(23, 25, 30, .08), 0 2px 6px rgba(23, 25, 30, .06);
}
.tile.answer { background: var(--g-tile); color: #fff; }

.tile.rv { animation-duration: var(--flip-dur); animation-timing-function: ease-in-out; animation-fill-mode: both; animation-delay: calc(var(--i, 0) * var(--flip-step)); }
.tile.rv.hit { animation-name: rv-hit; }
.tile.rv.near { animation-name: rv-near; }
.tile.rv.miss { animation-name: rv-miss; }
.tile.rv.answer { animation-name: rv-answer; animation-timing-function: cubic-bezier(.2, 1.2, .4, 1); }
@keyframes rv-hit {
  0% { transform: perspective(420px) rotateX(0); background: var(--g-tile); }
  49% { background: var(--g-tile); }
  50% { transform: perspective(420px) rotateX(90deg); background: var(--g-hit); }
  100% { transform: perspective(420px) rotateX(0); background: var(--g-hit); }
}
@keyframes rv-near {
  0% { transform: perspective(420px) rotateX(0); background: var(--g-tile); color: #fff; }
  49% { background: var(--g-tile); color: #fff; }
  50% { transform: perspective(420px) rotateX(90deg); background: var(--g-near); color: var(--near-ink); }
  100% { transform: perspective(420px) rotateX(0); background: var(--g-near); color: var(--near-ink); }
}
@keyframes rv-miss {
  0% { transform: perspective(420px) rotateX(0); background: var(--g-tile); color: #fff; }
  49% { background: var(--g-tile); color: #fff; }
  50% { transform: perspective(420px) rotateX(90deg); background: var(--g-off); color: var(--off-ink); }
  100% { transform: perspective(420px) rotateX(0); background: var(--g-off); color: var(--off-ink); }
}
@keyframes rv-answer {
  0% { transform: perspective(420px) rotateY(90deg) scale(.8); opacity: 0; }
  100% { transform: none; opacity: 1; }
}
.tile.win { animation: tile-win .62s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes tile-win { 0% { transform: none; } 40% { transform: translateY(-26%); } 70% { transform: translateY(5%); } 100% { transform: none; } }
@keyframes tile-pop { 0% { transform: scale(.86); } 60% { transform: scale(1.08); } 100% { transform: none; } }
.tile.hint-new { animation: hint-in .7s cubic-bezier(.3, 1.5, .5, 1) both; }
@keyframes hint-in { 0% { transform: scale(.4) rotate(-14deg); } 100% { transform: none; } }

/* ---------- Board ---------- */
.board { --ts: 56px; --gap: 8px; display: flex; flex-direction: column; gap: var(--gap); }
.row { display: flex; align-items: center; gap: var(--gap); }
.row .tiles { display: flex; gap: var(--gap); }
.row.shake { animation: row-shake .42s ease; }
@keyframes row-shake { 0%, 100% { transform: none; } 20% { transform: translateX(-10px); } 40% { transform: translateX(9px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.row-tag { width: var(--ts); display: flex; justify-content: flex-end; min-width: 0; }
.row-tag.right { justify-content: flex-start; }
.row-chip {
  max-width: 100%; padding: .34em .62em; border-radius: 999px; background: var(--c); color: #fff;
  font-weight: 700; font-size: clamp(10px, calc(var(--ts) * .19), 14px); line-height: 1.1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 6px rgba(23, 25, 30, .12);
}
.row-chip.wait { background: #fff; color: var(--muted); border: 1.5px dashed var(--line-2); box-shadow: none; font-weight: 600; }
.row.active .tile.slot, .row.active .tile.is-ghost:not(.is-hint) { box-shadow: inset 0 0 0 2px var(--rc, var(--line-2)), 0 2px 8px rgba(23, 25, 30, .06); }
.row.active .tile:not(.slot):not(.is-ghost) { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -3px 0 rgba(0, 0, 0, .3), 0 0 0 2px var(--rc, transparent), 0 4px 10px rgba(23, 25, 30, .14); }
.row-mark { color: var(--red); display: grid; place-items: center; }
.board.glow { animation: board-glow 1.4s ease-out; border-radius: 18px; }
@keyframes board-glow { 0% { filter: drop-shadow(0 0 0 transparent); } 30% { filter: drop-shadow(0 0 22px var(--wc, var(--red))); } 100% { filter: drop-shadow(0 0 0 transparent); } }

/* ---------- Play layout ---------- */
.view-play { display: flex; flex-direction: column; overflow: hidden; --kh: clamp(34px, 5.2vh, 50px); }
.strip {
  position: relative; z-index: 2; flex: none; display: flex; align-items: center; gap: 16px; padding: 12px 18px 10px;
  background: rgba(255, 255, 255, .94); border-bottom: 1px solid var(--line); box-shadow: 0 4px 16px rgba(16, 24, 40, .05);
}
.strip-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.strip-brand .event-logo { height: 34px; max-width: 150px; }
.strip-logo { display: flex; gap: 3px; --ts: 24px; }
.strip-logo .tile { font-size: 12px; box-shadow: none; }
.strip-title { display: grid; min-width: 0; line-height: 1.2; }
.strip-title b { font: 700 15px/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 24vw; }
.strip-title small { color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 24vw; }
.strip-round { font: 700 15px/1 var(--font-display); white-space: nowrap; padding-left: 16px; border-left: 1px solid var(--line); }
.strip-round small { color: var(--muted); font: 500 13px/1 var(--font-body); margin-left: 8px; }
.markers { display: flex; gap: 6px; flex-wrap: wrap; }
.marker {
  min-width: 32px; height: 32px; padding: 0 7px; border-radius: 8px; display: grid; place-items: center;
  font: 700 13px/1 var(--font-display); background: var(--surface-3); color: var(--muted); border: 1px solid transparent;
}
.marker.won { background: var(--c); color: #fff; }
.marker.lost { background: #fff; border-color: var(--line-2); color: var(--faint); }
.marker.now { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--ink-2); }
.marker.now:not(.won):not(.lost) { background: var(--g-tile); color: #fff; }
.strip-actions { margin-left: auto; display: flex; gap: 4px; }

.play-main {
  flex: 1; min-height: 0; display: grid;
  grid-template-columns: clamp(210px, 19vw, 290px) minmax(0, 1fr) clamp(236px, 20.5vw, 300px);
  gap: 18px; padding: 16px 18px 18px;
}
.teams { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding: 4px 10px 8px 2px; }
.center {
  display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; padding: 14px 18px 16px;
  background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-2);
}
.word-head { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; }
.word-len { font: 700 18px/1.2 var(--font-display); display: inline-flex; align-items: center; gap: 10px; }
.word-len::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--red); }
.legend { display: flex; gap: 6px 14px; color: var(--muted); font-size: 13px; font-weight: 500; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 18px; height: 18px; border-radius: 5px; flex: none; }
.legend i.hit { background: var(--g-hit); }
.legend i.near { background: var(--g-near); }
.legend i.miss { background: var(--g-off); box-shadow: inset 0 0 0 1px var(--line-2); }
.board-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }
.bottom { flex: none; min-height: calc(var(--kh) * 3 + 20px); display: grid; place-items: center; }
.bottom.no-kb { min-height: 92px; }
.kb-off { color: var(--muted); }

/* Team cards */
.lectern {
  position: relative; flex: none; border-radius: 16px; padding: 12px 14px 14px;
  background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--c); box-shadow: var(--shadow-1);
  transition: transform .25s, box-shadow .25s, border-color .25s, opacity .25s, filter .25s;
}
.lec-head { display: flex; align-items: center; gap: 12px; }
.lamp {
  --sz: 44px; flex: none; width: var(--sz); height: var(--sz); border-radius: 50%;
  border: 3px solid #fff; padding: 0;
  background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 44%), var(--c);
  color: #fff; font: 800 16px/1 var(--font-display); display: grid; place-items: center; text-shadow: 0 1px 1px rgba(0, 0, 0, .25);
  box-shadow: 0 0 0 1px rgba(23, 25, 30, .1), inset 0 -4px 0 rgba(0, 0, 0, .2), 0 3px 8px rgba(23, 25, 30, .18); cursor: pointer;
  transition: opacity .2s, transform .12s, box-shadow .2s;
}
.lamp.static { cursor: default; }
button.lamp:hover:not(:disabled) { transform: scale(1.06); }
button.lamp:active:not(:disabled) { transform: scale(.93); }
button.lamp:disabled { cursor: default; opacity: .38; }
.lamp.nudge { animation: lamp-nudge .5s ease; }
@keyframes lamp-nudge { 25% { transform: scale(1.18); } 60% { transform: scale(.95); } }
.lectern.is-on { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 14px 36px var(--cg); transform: translateX(4px); }
.lectern.is-on .lamp { opacity: 1; animation: lamp-pulse 1.1s ease-in-out infinite; }
@keyframes lamp-pulse {
  0%, 100% { box-shadow: 0 0 0 4px var(--cg), 0 0 16px var(--c); }
  50% { box-shadow: 0 0 0 9px rgba(255, 255, 255, 0), 0 0 30px var(--c); }
}
.lectern.is-locked { opacity: .55; filter: grayscale(.7); }
.lec-id { min-width: 0; }
.lec-name { font: 700 17px/1.15 var(--font-display); overflow-wrap: anywhere; }
.lec-members { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.score-window {
  margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line);
}
.score { font: 800 34px/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--ink); }
.score-round { display: grid; justify-items: end; gap: 5px; color: var(--muted); font-size: 12px; text-align: right; line-height: 1.25; }
.score-round b { color: var(--ink); font: 700 14px/1.2 var(--font-display); }
.lec-tag { margin-top: 9px; display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--c); color: #fff; font-size: 12px; font-weight: 700; }
.lectern.bump .score { animation: score-bump .55s ease; }
@keyframes score-bump { 40% { transform: scale(1.16); color: var(--red); } }
.teams.compact .lectern { padding: 9px 12px 11px; }
.teams.compact .lamp { --sz: 36px; font-size: 14px; }
.teams.compact .score { font-size: 26px; }
.teams.compact .score-window { margin-top: 7px; padding: 6px 10px; }

/* Host console */
.console {
  display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; padding: 16px 14px;
  background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-1);
}
.clock { position: relative; flex: none; width: min(100%, 156px); aspect-ratio: 1; margin: 0 auto; cursor: pointer; border-radius: 50%; }
.clock svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.clock .trk { fill: var(--surface-2); stroke: var(--surface-3); stroke-width: 9; }
.clock .arc { fill: none; stroke: var(--tc, var(--ok)); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 326.73; transition: stroke .3s; }
.clock-face { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
.clock-num { font: 800 42px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); }
.clock-lbl { color: var(--muted); font-size: 12px; margin-top: 5px; }
.clock.idle .arc { stroke: var(--line-2); }
.clock.idle .clock-num { color: var(--faint); }
.clock.warn { --tc: #f59e0b; }
.clock.danger { --tc: var(--red); }
.clock.danger .clock-num { color: var(--red); animation: tick-pulse 1s ease-in-out infinite; }
.clock.paused .clock-lbl { color: var(--red); font-weight: 700; }
@keyframes tick-pulse { 50% { transform: scale(1.12); } }
.status { text-align: center; min-height: 64px; }
.status-main { font: 700 19px/1.2 var(--font-display); overflow-wrap: anywhere; }
.status-main.is-wait { animation: wait-glow 1.6s ease-in-out infinite; }
@keyframes wait-glow { 50% { color: var(--red); } }
.status-sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meters div { padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.meters span { display: block; font-size: 12px; color: var(--muted); }
.meters b { font: 700 16px/1.3 var(--font-display); font-variant-numeric: tabular-nums; }
.console-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.console-grid .btn { justify-content: flex-start; font-size: 13.5px; padding: .6em .65em; white-space: normal; text-align: left; line-height: 1.15; min-width: 0; }
.shortcuts { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.shortcuts span { display: inline-flex; align-items: center; gap: 4px; }

/* Keyboard */
.kb { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.kb-row { display: flex; gap: 6px; }
.key {
  min-width: clamp(28px, 3.3vw, 46px); height: var(--kh); padding: 0 6px; border: 0; border-radius: 9px;
  background: var(--surface-3); color: var(--ink); font: 700 clamp(13px, 1.35vw, 17px)/1 var(--font-display);
  box-shadow: inset 0 -2px 0 rgba(23, 25, 30, .1); cursor: pointer; transition: background .25s, color .25s, transform .08s;
}
.key:hover { background: #e1e4e9; }
.key:active { transform: translateY(1px) scale(.96); }
.key.wide { min-width: clamp(54px, 6.4vw, 84px); font: 700 13px/1 var(--font-body); }
.key.hit { background: var(--g-hit); color: #fff; }
.key.near { background: var(--near); color: var(--near-ink); }
.key.miss { background: #f8f9fa; color: #c3c8cf; box-shadow: inset 0 0 0 1px var(--line); }

/* Result panel */
.result {
  width: min(100%, 800px); display: flex; align-items: center; gap: 14px 18px; padding: 14px 20px; border-radius: 18px;
  background: linear-gradient(90deg, var(--cg2, rgba(199, 0, 11, .08)), #fff 62%);
  border: 1px solid var(--line); border-left: 6px solid var(--c, var(--red)); box-shadow: var(--shadow-2);
  animation: result-in .45s cubic-bezier(.2, 1.2, .4, 1) both;
}
.result.still { animation: none; }
@keyframes result-in { from { opacity: .001; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
.result-text { flex: 1; min-width: 0; }
.result-title { font: 800 24px/1.15 var(--font-display); overflow-wrap: anywhere; }
.result-sub { color: var(--muted); margin-top: 4px; }
.result-pts { font: 900 44px/1 var(--font-display); color: var(--red); }
.result-actions { display: flex; flex-direction: column; gap: 8px; }
.result-actions.row-actions { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; max-width: 460px; }
.result.is-fail { --c: var(--near); --cg2: rgba(255, 194, 26, .18); flex-wrap: wrap; }
.result.is-fail .result-text { flex: 1 1 320px; }
.result.is-reveal { --c: var(--ink-2); --cg2: rgba(43, 47, 54, .07); }
.result.is-verify { --c: #f59e0b; --cg2: rgba(245, 158, 11, .13); flex-wrap: wrap; }
.result.is-verify .result-text { flex: 1 1 300px; }
.answer-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.known-row { flex-wrap: nowrap; }
.known-row .tile.is-ghost:not(.is-hint) > b { color: var(--ink); }
.verify-word { font: 800 1em/1 var(--font-display); letter-spacing: .06em; color: #b45309; }

/* ---------- Overlays ---------- */
.flash {
  position: fixed; inset: 0; z-index: 60; pointer-events: none; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 50%, var(--cf) 0%, rgba(255, 255, 255, 0) 64%);
  animation: flash-bg 1s ease-out forwards;
}
.flash-name {
  font: 900 clamp(44px, 8vw, 116px)/1.05 var(--font-display); color: #fff; background: var(--c);
  padding: .16em .55em .22em; border-radius: .3em; text-align: center; max-width: calc(100vw - 40px); overflow-wrap: anywhere;
  box-shadow: 0 0 0 6px rgba(255, 255, 255, .92), 0 24px 70px var(--cf);
  animation: flash-name 1s cubic-bezier(.2, 1.3, .4, 1) forwards;
}
@keyframes flash-bg { 0% { opacity: 0; } 12% { opacity: 1; } 70% { opacity: .9; } 100% { opacity: 0; } }
@keyframes flash-name { 0% { transform: scale(.4); opacity: 0; } 25% { transform: scale(1.06); opacity: 1; } 72% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.12); opacity: 0; } }
.fly { position: fixed; left: 0; top: 0; z-index: 70; pointer-events: none; font: 900 40px/1 var(--font-display); color: var(--red); text-shadow: 0 2px 0 #fff, 0 0 16px rgba(255, 255, 255, .95); }
.confetti { position: fixed; inset: 0; z-index: 65; pointer-events: none; }

.modal-host { position: fixed; inset: 0; z-index: 80; display: none; }
.modal-host.open { display: grid; place-items: center; }
.modal-back { position: absolute; inset: 0; background: rgba(17, 19, 24, .42); backdrop-filter: blur(4px); animation: fade-in .2s ease both; }
@keyframes fade-in { from { opacity: 0; } }
.modal {
  position: relative; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: auto;
  background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--red);
  border-radius: 20px; padding: 24px; box-shadow: var(--shadow-3);
  animation: modal-in .28s cubic-bezier(.2, 1.2, .4, 1) both;
}
.modal.wide { width: min(820px, calc(100vw - 32px)); }
@keyframes modal-in { from { opacity: 0; transform: translateY(12px) scale(.97); } }
.modal h2 { font: 700 22px/1.2 var(--font-display); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
.modal h3 { font: 700 15px/1.3 var(--font-display); margin: 20px 0 6px; }
.modal p { margin: 0 0 12px; }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.confirm p { font-size: 17px; }

.toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast {
  padding: 10px 16px 10px 14px; border-radius: 12px; background: #1f2329; color: #fff; border-left: 4px solid #8a909c;
  font-weight: 600; font-size: 15px; box-shadow: 0 10px 30px rgba(16, 24, 40, .25); animation: toast-in .3s cubic-bezier(.2, 1.3, .4, 1) both;
}
.toast.warn { border-left-color: #f5b400; }
.toast.err { border-left-color: var(--red-2); }
.toast.ok { border-left-color: #10b981; }
.toast.out { animation: toast-out .3s ease forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(-10px) scale(.96); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }

/* ---------- Event brand (uploaded logo + subtitle) ---------- */
.event-logo { display: block; width: auto; object-fit: contain; }
.brand { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; margin: 0 0 26px; }
.brand:empty { display: none; }
.brand .event-logo { height: clamp(44px, 5vw, 64px); max-width: min(280px, 60vw); }
.brand-sub { display: inline-flex; align-items: center; gap: 10px; font: 600 14px/1.25 var(--font-display); letter-spacing: .02em; color: var(--red); }
.brand-sub::before { content: ""; width: 22px; height: 3px; border-radius: 3px; background: currentColor; flex: none; }
.brand .event-logo + .brand-sub { padding-left: 16px; border-left: 2px solid var(--line-2); }
.brand .event-logo + .brand-sub::before { display: none; }

/* ---------- Home ---------- */
.home {
  min-height: 100%; max-width: 1320px; margin: 0 auto; display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); align-items: center; gap: clamp(28px, 5vw, 72px);
  padding: clamp(28px, 5vw, 72px);
}
.logo { display: flex; gap: clamp(6px, 1vw, 12px); --ts: clamp(54px, 7.6vw, 100px); }
.logo .tile { font-size: calc(var(--ts) * .5); animation: logo-in .8s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: calc(var(--i) * 110ms); }
@keyframes logo-in { from { transform: perspective(500px) rotateX(-95deg) translateY(-24px); opacity: .001; } to { transform: none; opacity: 1; } }
.home h1 { font: 800 clamp(30px, 4.2vw, 56px)/1.06 var(--font-display); letter-spacing: -.02em; margin: 28px 0 14px; }
.home-lede { font-size: clamp(16px, 1.45vw, 19px); color: var(--muted); max-width: 46ch; margin: 0 0 26px; }
.home-actions, .home-links { display: flex; flex-wrap: wrap; gap: 12px; }
.home-links { margin-top: 12px; }
.home .notice { margin-top: 18px; max-width: 52ch; }
.demo { justify-self: center; padding: clamp(18px, 2.4vw, 28px); border-radius: 24px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-2); }
.demo .board { --ts: clamp(42px, 4.4vw, 62px); --gap: clamp(6px, .7vw, 9px); }
.demo-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 16px; font: 700 14px/1.2 var(--font-display); }
.demo-head span { display: inline-flex; align-items: center; gap: 8px; }
.demo-head span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red); animation: blink 1.4s infinite; }
.demo-head small { color: var(--muted); font: 500 13px/1.2 var(--font-body); }
.demo-caption { color: var(--ink); font-size: 15px; font-weight: 500; margin: 18px 0 0; min-height: 2.9em; max-width: 34ch; }
.demo .legend { flex-direction: column; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }

/* ---------- Round intro ---------- */
.intro { min-height: 100%; display: grid; place-items: center; padding: 40px 20px; text-align: center; }
.intro .brand { justify-content: center; margin-bottom: 30px; }
.intro-title { display: flex; align-items: center; justify-content: center; gap: 12px; --ts: clamp(64px, 9vw, 116px); }
.intro-word { font: 800 clamp(34px, 5vw, 64px)/1 var(--font-display); margin-right: 8px; animation: rise-in .6s cubic-bezier(.2, 1.2, .4, 1) both; }
.intro-title .tile { font-size: calc(var(--ts) * .56); animation: logo-in .8s cubic-bezier(.2, 1.3, .4, 1) both; animation-delay: calc(.25s + var(--i) * 120ms); }
.intro-of { color: var(--muted); font: 600 20px/1 var(--font-body); margin-left: 4px; }
.intro-name { font: 600 22px/1.3 var(--font-body); color: var(--red); margin-top: 14px; }
.intro-words { display: flex; justify-content: center; gap: 8px; --ts: 44px; flex-wrap: wrap; }
.intro-words .tile { font-size: 18px; animation: drop-in .5s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: var(--d); }
.intro-note { color: var(--muted); margin: 14px 0 28px; }
@keyframes rise-in { from { opacity: .001; transform: translateY(18px); } }
@keyframes drop-in { from { opacity: .001; transform: translateY(-22px) scale(.8); } }

/* ---------- Results ---------- */
.results { max-width: 1120px; margin: 0 auto; padding: clamp(24px, 3.4vw, 44px) 20px 44px; }
.results .brand { margin-bottom: 14px; }
.results-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px 28px; margin-bottom: 22px; }
.results h1 { font: 800 clamp(28px, 3.8vw, 48px)/1.1 var(--font-display); margin: 0 0 8px; letter-spacing: -.02em; }
.results-lede { color: var(--muted); font-size: 17px; margin: 0; }
.results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.panel { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; min-width: 0; box-shadow: var(--shadow-1); }
.panel h2 { font: 700 16px/1.2 var(--font-display); margin: 0 0 14px; }
.span2 { grid-column: 1 / -1; }
.recap { display: grid; gap: 4px; }
.recap.tall { max-height: 420px; overflow-y: auto; padding-right: 6px; }
.recap h3 { font: 600 13px/1.2 var(--font-body); color: var(--muted); margin: 12px 0 4px; }
.recap h3:first-child { margin-top: 0; }
.recap-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
.recap-row + .recap-row { border-top: 1px dashed var(--line); }
.mini { display: flex; gap: 3px; flex-wrap: wrap; }
.mini .tile { font-size: calc(var(--ts) * .5); box-shadow: none; }
.pill { padding: 4px 10px; border-radius: 999px; background: var(--c); color: #fff; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill.none { background: var(--surface-3); color: var(--muted); font-weight: 600; }
.results-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 12px; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 220px)); justify-content: center; align-items: end; gap: 14px; margin: 18px 0 34px; }
.pod { text-align: center; min-width: 0; }
.pod-name { font: 700 18px/1.2 var(--font-display); margin-bottom: 4px; overflow-wrap: anywhere; animation: rise-in .6s ease both; animation-delay: calc(var(--d) + .5s); }
.pod-score { color: var(--muted); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.pod-score span { color: var(--ink); font: 700 18px/1 var(--font-display); }
.pod-block {
  height: var(--h); border-radius: 14px 14px 4px 4px; background-color: var(--c);
  background-image: linear-gradient(180deg, rgba(255, 255, 255, .24), rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, .08));
  display: grid; place-items: start center; padding-top: 14px; font: 900 42px/1 var(--font-display); color: #fff;
  box-shadow: var(--shadow-2); transform-origin: bottom; animation: pod-rise .9s cubic-bezier(.2, 1.1, .3, 1) both; animation-delay: var(--d);
}
.pod.p1 { --h: 200px; } .pod.p2 { --h: 140px; } .pod.p3 { --h: 100px; }
.crown { display: inline-block; color: var(--gold); margin-bottom: 4px; animation: crown-drop .8s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: 1.5s; filter: drop-shadow(0 4px 10px rgba(242, 169, 0, .45)); }
@keyframes pod-rise { from { transform: scaleY(0); } }
@keyframes crown-drop { from { opacity: 0; transform: translateY(-40px) rotate(-20deg); } }

/* ---------- Admin ---------- */
.admin { max-width: 1160px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 32px) 80px; }
.admin-top { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin-bottom: 18px; }
.admin-top h1 { font: 800 26px/1.1 var(--font-display); margin: 0; }
.admin-top .btn-primary { margin-left: auto; }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.sync.ok i { background: #10b981; }
.sync.busy i { background: #f5b400; animation: blink 1s infinite; }
.sync.err i { background: var(--red-2); }
@keyframes blink { 50% { opacity: .25; } }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-1); margin-bottom: 18px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: .62em 1em; border-radius: 10px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab.on { background: var(--red-soft); color: var(--red); box-shadow: inset 0 0 0 1px rgba(199, 0, 11, .22); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
.toolbar p { margin: 0; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.count { padding: 4px 11px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.count b { font: 700 13px/1 var(--font-display); color: var(--ink); }
.empty { padding: 28px; border: 1.5px dashed var(--line-2); border-radius: 16px; text-align: center; color: var(--muted); background: rgba(255, 255, 255, .6); }
.inp {
  width: 100%; padding: .55em .75em; border-radius: 10px; border: 1px solid var(--line-2);
  background: #fff; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
}
.inp::placeholder { color: var(--faint); }
.inp:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(199, 0, 11, .13); }
.inp.bad { border-color: rgba(199, 0, 11, .75); background: #fffafa; }
.inp.dup { border-color: #ea8a1a; background: #fffaf2; }
.inp-sm { max-width: 160px; }
.inp-xs { width: 64px; text-align: center; }
.inp.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
textarea.inp { resize: vertical; min-height: 90px; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.tour-rounds { display: grid; gap: 14px; margin-bottom: 18px; }
.pool { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-1); }
.pool:not(.open) .pool-head { border-bottom-color: transparent; }
.pool-toggle { display: flex; align-items: center; gap: 12px; flex: 1 1 360px; min-width: 0; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.pt-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.pt-row .pool-count { padding: 2px 9px; font-size: 12px; }
.pool-toggle:focus-visible { outline: 3px solid rgba(199, 0, 11, .45); outline-offset: 4px; border-radius: 10px; }
.chev { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: var(--muted); transition: transform .2s, background .15s; }
.pool-toggle:hover .chev { background: var(--surface-2); color: var(--ink); }
.pool.open .chev { transform: rotate(180deg); }
.pool-body { display: grid; gap: 14px; padding: 14px; animation: rise-in .25s ease both; }
.pool-mix { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); min-height: 8px; }
.pool-mix:empty { display: none; }
.mix { display: flex; width: 120px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line); flex: none; }
.mix i { display: block; height: 100%; }
.mix i.cat-t { background: #2563eb; }
.mix i.cat-g { background: #f59e0b; }
.mslots { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 10px; }
.scard { display: grid; gap: 6px; align-content: start; padding: 10px 10px 11px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.scard.done { background: #fff; }
.sc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; }
.sc-head b { font: 700 13.5px/1.2 var(--font-display); }
.sc-state { padding: 2px 8px; border-radius: 99px; background: #e3f5ec; color: #047857; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.sc-who { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -2px; }
.slot { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; align-items: center; gap: 6px; }
.slot-no { font: 700 12px/1 var(--font-display); color: var(--faint); text-align: center; }
.slot-in { width: 100%; min-width: 0; padding: .42em .6em; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; font: 700 14px/1.2 var(--font-display); letter-spacing: .06em; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s; }
.slot-in::placeholder { font: 500 13px/1.2 var(--font-body); letter-spacing: 0; color: var(--faint); }
.slot-in:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(199, 0, 11, .12); }
.slot.empty .slot-in { border-style: dashed; background: transparent; }
.slot.bad .slot-in { border-color: rgba(199, 0, 11, .6); color: var(--red); }
.slot.dup .slot-in { border-color: #ea8a1a; background: #fff7ec; }
.slot.unk .slot-in { border-style: dashed; border-color: #e9a650; }
.slot.used .slot-in { color: var(--faint); text-decoration: line-through; background: transparent; border-color: var(--line); }
.slot.used .slot-no { color: #059669; }
.hide-words .slot-in:not(:focus) { color: transparent; text-shadow: 0 0 9px rgba(23, 25, 30, .75); }
.cat { display: inline-grid; place-items: center; min-width: 36px; height: 26px; padding: 0 7px; border-radius: 7px; border: 1px solid transparent; font: 800 10.5px/1 var(--font-display); letter-spacing: .06em; cursor: pointer; transition: filter .15s; }
.cat:hover:not(:disabled) { filter: brightness(.95); }
.cat:disabled { cursor: default; opacity: .55; }
.cat-t { background: #e6efff; color: #1d4ed8; border-color: #c6d8fb; }
.cat-g { background: #fff1d6; color: #b45309; border-color: #f5d79e; }
.cat-x { background: #fff; color: var(--faint); border-color: var(--line); }
.cat.mini { min-width: 0; height: 19px; padding: 0 5px; margin: 0 0 0 2px; font-size: 9.5px; border-radius: 5px; align-self: center; }
.swap { width: 30px; height: 30px; }
.spare { border-top: 1px solid var(--line); padding-top: 12px; }
.spare-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; }
.spare-head b { font: 700 14px/1.2 var(--font-display); }
.spare-head small { color: var(--muted); font-size: 12.5px; }
.pill-n { padding: 1px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 700; }
.spare .chips { padding: 10px 0 0; }
.pool-head { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.round-no { --ts: 34px; font-size: 14px; box-shadow: none; }
.pool-title { display: grid; gap: 2px; min-width: 160px; }
.pool-title b { font: 700 16px/1.2 var(--font-display); }
.pool-title small { color: var(--muted); font-size: 13px; }
.pool-count { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pool-count.ok { background: #e3f5ec; color: #047857; }
.pool-count.warn { background: #fff1db; color: #b45309; }
.pool-set { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-left: auto; }
.att { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.att .inp-xs { width: 60px; padding: .35em .3em; }
.att b { min-width: 2ch; text-align: center; font: 700 15px/1 var(--font-display); color: var(--ink); }
.pool-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.btn-fill { border-color: #f0c870; background: #fff8e6; color: #92400e; }

.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px 14px 14px; }
.wchip-wrap { display: inline-flex; align-items: center; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); transition: border-color .15s, background .15s, box-shadow .15s; }

.wbox { display: inline-grid; }

.wsize { visibility: hidden; white-space: pre; min-width: 3ch; }
.wchip { border: 0; margin: 0; background: transparent; color: var(--ink); outline: none; width: 100%; min-width: 0; }

.wchip.add { border: 1.5px dashed var(--line-2); border-radius: 8px; background: #fff; padding: 4px 10px; width: 190px; font-weight: 700; }

.pool-empty { margin: 0; padding: 14px; color: var(--muted); font-size: 14px; }
.pool-note { margin: 0; padding: 0 14px 12px; font-size: 13px; color: #b45309; }
.fmt { display: grid; gap: 12px; }

.team-table { display: grid; gap: 6px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-1); }
.trow { display: grid; grid-template-columns: 24px 34px minmax(140px, 1.2fr) minmax(110px, 1fr) minmax(110px, 1fr) 30px 30px; align-items: center; gap: 8px; }
.trow.off .inp, .trow.off .t-no, .trow.off .swatch { opacity: .42; }
.tcheck { position: relative; width: 22px; height: 22px; display: inline-grid; place-items: center; cursor: pointer; }
.tcheck input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.tcheck i { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line-2); background: #fff; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.tcheck input:checked + i { background: var(--red); border-color: var(--red); }
.tcheck input:checked + i::after { content: ""; width: 10px; height: 5px; border: solid #fff; border-width: 0 0 2.5px 2.5px; transform: translateY(-1px) rotate(-45deg); }
.tcheck input:focus-visible + i { outline: 3px solid rgba(199, 0, 11, .5); outline-offset: 2px; }
.trow.thead { font-size: 12px; font-weight: 600; color: var(--muted); }
.t-no { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font: 700 12px/1 var(--font-display); }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; background: var(--s); cursor: pointer; padding: 0; box-shadow: 0 0 0 1px var(--line-2); transition: transform .12s; }
.swatch:hover { transform: scale(1.12); }
.inline-field { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.import-list li { margin-bottom: 6px; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.settings .panel { display: grid; gap: 16px; }
.settings .panel h2 { margin: 0; }
.field { display: grid; gap: 6px; }
.field > span { font-weight: 600; font-size: 14px; }
.field small, .switch-row small { color: var(--muted); font-size: 13px; display: block; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); gap: 4px; justify-self: start; }
.seg button { border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: 14px; padding: .5em .9em; border-radius: 9px; cursor: pointer; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: #fff; color: var(--red); box-shadow: 0 1px 3px rgba(16, 24, 40, .12), inset 0 0 0 1px rgba(199, 0, 11, .25); }
.switch-row { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.sw-label { font-weight: 600; font-size: 14px; }
.switch { position: relative; width: 44px; height: 26px; flex: none; margin-top: 1px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: #d3d8df; transition: background .2s; }
.switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(16, 24, 40, .25); transition: transform .25s cubic-bezier(.3, 1.4, .5, 1); }
.switch input:checked + i { background: var(--red); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 3px solid rgba(199, 0, 11, .5); outline-offset: 2px; }
.preview { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.preview b { color: var(--ink); }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.logo-edit { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
.logo-slot { width: 176px; height: 88px; flex: none; border-radius: 12px; border: 1.5px dashed var(--line-2); background: var(--surface-2); display: grid; place-items: center; padding: 8px; color: var(--faint); font-size: 13px; text-align: center; }
.logo-slot.has-logo { border-style: solid; border-color: var(--line); background: #fff; }
.logo-slot .event-logo { max-width: 100%; max-height: 100%; }
.logo-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.modal .field { margin-top: 14px; }
.inline { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; }
.check { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; cursor: pointer; accent-color: var(--red); }
.score-list { display: grid; gap: 8px; }
.score-item { display: grid; grid-template-columns: 12px minmax(0, 1fr) 60px auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.score-item .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.score-item b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-val { font: 800 20px/1 var(--font-display); text-align: right; font-variant-numeric: tabular-nums; }
.score-btns { display: flex; gap: 4px; }
.rules ul { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 10px; }
.rules li { display: flex; align-items: center; gap: 12px; }
.rules li .tile { --ts: 38px; font-size: 16px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 14px; }
.keys dt { color: var(--ink); font-weight: 600; white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }
.issue-list { margin: 0; padding-left: 20px; }
.pin-view { min-height: 100%; display: grid; place-items: center; padding: 24px; }
.pin-card { width: min(380px, 100%); text-align: center; padding: 30px 26px; border-radius: 22px; background: #fff; border: 1px solid var(--line); border-top: 4px solid var(--red); box-shadow: var(--shadow-2); display: grid; gap: 12px; justify-items: center; }
.pin-card h1 { font: 700 22px/1.2 var(--font-display); margin: 0; }
.pin-card p { margin: 0; }
.pin-card form { display: flex; gap: 8px; width: 100%; }
.pin-input { text-align: center; font: 700 20px/1 var(--font-display); letter-spacing: .3em; }
.pin-card.shake { animation: row-shake .42s ease; }
.pin-icon { color: var(--red); }

/* ---------- Word check ---------- */
.tile.void { background: #f2f3f5; color: #a1a7b1; box-shadow: inset 0 0 0 1.5px #dde1e6; }
.tile.void::after { content: ""; position: absolute; left: 14%; right: 14%; top: 50%; height: 2px; border-radius: 2px; background: rgba(199, 0, 11, .75); transform: rotate(-9deg); }
.row-void { font-size: clamp(10px, calc(var(--ts) * .19), 13px); font-weight: 700; color: var(--red); background: #fff; border: 1px solid rgba(199, 0, 11, .45); border-radius: 999px; padding: .25em .55em; white-space: nowrap; }
.row.void-new .tiles { animation: row-shake .42s ease; }
.row-void.is-check { color: #b45309; border-color: rgba(217, 119, 6, .5); }
.dict-state { margin: 0; font-size: 13px; color: var(--muted); }
.dict-state b { color: var(--ink); }

/* ---------- Tournament: match on the board ---------- */
.teams.duo { gap: 10px; }
.vs-mini { align-self: center; padding: 5px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-1); font: 800 12px/1 var(--font-display); letter-spacing: .06em; color: var(--muted); }
.match-info { margin-top: 6px; display: grid; gap: 4px; padding: 12px 14px; border-radius: 14px; border: 1.5px dashed var(--line-2); font-size: 13px; color: var(--muted); }
.match-info b { font: 700 14px/1.25 var(--font-display); color: var(--ink); }
.pips { display: flex; gap: 4px; }
.pips i { width: 11px; height: 11px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--line-2); transition: background .3s, box-shadow .3s; }
.pips i.on { background: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
.result-score { display: flex; align-items: center; gap: 10px; font: 900 40px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.result-score i { font-style: normal; font-weight: 700; color: var(--faint); }

/* ---------- Tournament: bracket ---------- */
.view-bracket .strip { position: sticky; top: 0; }
.bracket { max-width: 1280px; margin: 0 auto; padding: 22px clamp(16px, 3vw, 32px) 56px; }
.bk-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px 24px; margin-bottom: 16px; }
.bk-head h1 { font: 800 clamp(28px, 3.2vw, 42px)/1.08 var(--font-display); margin: 0 0 6px; letter-spacing: -.02em; }
.bk-head p { margin: 0; color: var(--muted); }
.bk-head p .warn { color: #b45309; font-weight: 600; }
.bk-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.rtabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-1); overflow-x: auto; margin-bottom: 18px; }
.rtab { flex: 1 0 auto; display: grid; gap: 3px; text-align: left; border: 0; background: transparent; padding: .55em .9em; border-radius: 10px; cursor: pointer; color: var(--muted); }
.rtab:hover { background: var(--surface-2); }
.rtab b { display: inline-flex; align-items: center; gap: 6px; font: 700 14px/1.2 var(--font-display); color: var(--ink); white-space: nowrap; }
.rtab small { font-size: 12px; white-space: nowrap; }
.rtab.on { background: var(--red-soft); box-shadow: inset 0 0 0 1px rgba(199, 0, 11, .22); }
.rtab.on b { color: var(--red); }
.rtab.done b::after { content: "✓"; color: var(--ok); font-weight: 800; }
.rtab.now small::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-right: 6px; vertical-align: 1px; animation: blink 1.4s infinite; }
.bk-done { display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin-bottom: 16px; border-radius: 14px; background: #fff; border: 1px solid var(--line); border-left: 6px solid var(--ok); box-shadow: var(--shadow-1); color: var(--ok); animation: result-in .45s cubic-bezier(.2, 1.2, .4, 1) both; }
.bk-done div { display: grid; gap: 2px; color: var(--ink); }
.bk-done span { color: var(--muted); font-size: 14px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.mcard { display: grid; gap: 6px; padding: 10px 12px 12px; text-align: left; font: inherit; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-1); transition: transform .15s, box-shadow .15s, border-color .15s; animation: rise-in .4s ease both; }
button.mcard { cursor: pointer; }
button.mcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--line-2); }
.mcard.is-next, .mcard.is-live { border-color: var(--red); box-shadow: 0 0 0 3px rgba(199, 0, 11, .12), var(--shadow-2); }
.mcard.is-done { background: var(--surface-2); box-shadow: none; }
.mcard-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mstate { padding: 2px 8px; border-radius: 999px; background: var(--surface-3); font-size: 11px; font-weight: 700; }
.mcard.is-next .mstate, .mcard.is-live .mstate { background: var(--red); color: #fff; }
.mcard.is-done .mstate { background: #e3f5ec; color: #047857; }
.mteam { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 9px; background: var(--surface-2); }
.mcard.is-done .mteam { background: #fff; }
.mteam i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--line-2)); }
.mteam b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mteam span { font: 700 15px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--muted); }
.mteam.win { box-shadow: inset 0 0 0 1.5px var(--c); }
.mteam.win b, .mteam.win span { color: var(--ink); font-weight: 800; }
.mteam.lose { opacity: .5; }
.mteam.tbd b { color: var(--faint); font-weight: 500; font-style: italic; }
.mcard-foot { display: flex; justify-content: flex-end; }
.mcard.is-edit { border-style: dashed; border-color: var(--line-2); animation: none; }
.mcard.is-edit .mstate { background: #fff1db; color: #b45309; }
select.inp.slot { padding: .45em .6em; font-weight: 600; }
.console-grid .btn.span2 { grid-column: 1 / -1; justify-content: center; }
.byes { margin-top: 22px; }
.byes h3 { font: 700 15px/1.2 var(--font-display); margin: 0 0 10px; }
.bye-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.bye-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.bye-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tree { overflow-x: auto; padding: 4px 4px 18px; }
.tree-in { position: relative; }
.tree-in h3 { position: absolute; top: 0; display: grid; gap: 2px; margin: 0; text-align: center; font: 700 14px/1.2 var(--font-display); white-space: nowrap; }
.tree-in h3 small { font: 500 12px/1.2 var(--font-body); color: var(--muted); }
.tlines { position: absolute; left: 0; overflow: visible; pointer-events: none; }
.tlines path { fill: none; stroke: var(--line-2); stroke-width: 2; stroke-linejoin: round; }
.tpos { position: absolute; transform: translateY(-50%); }
.tteam.tbd b { color: var(--faint); font-weight: 500; font-size: 12px; }
.bye-chip.tbd { color: var(--muted); font-weight: 500; }
.bye-chip.tbd i { background: var(--line-2); }
.tcard { width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-1); overflow: hidden; }
.tcard.now { border-color: var(--red); box-shadow: 0 0 0 3px rgba(199, 0, 11, .12); }
.tcard.bye { background: var(--surface-2); box-shadow: none; }
.tteam { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 7px; padding: 4px 9px; font-size: 13px; }
.tteam + .tteam { border-top: 1px solid var(--line); }
.tteam i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--line-2)); }
.tteam b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tteam span { font: 700 13px/1 var(--font-display); color: var(--muted); }
.tteam.win { background: #fff; box-shadow: inset 3px 0 0 var(--c); }
.tteam.win b, .tteam.win span { color: var(--ink); font-weight: 800; }
.tteam.lose { opacity: .45; }
.tteam.tbd b { color: var(--faint); font-weight: 500; font-style: italic; }

/* ---------- Tournament: match intro, match result, champion ---------- */
.intro-kicker { display: inline-flex; align-items: center; gap: 10px; font: 700 16px/1.2 var(--font-display); color: var(--red); margin-bottom: 22px; animation: rise-in .5s ease both; }
.vs-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 18px clamp(16px, 3vw, 40px); margin: 0 0 30px; }
.vs-team { width: min(340px, 86vw); padding: 22px 24px; border-radius: 20px; background: #fff; border: 1px solid var(--line); border-top: 6px solid var(--c); box-shadow: var(--shadow-2); display: grid; gap: 6px; animation: rise-in .6s cubic-bezier(.2, 1.2, .4, 1) both; animation-delay: var(--d); }
.vs-team b { font: 800 clamp(26px, 3.2vw, 40px)/1.1 var(--font-display); overflow-wrap: anywhere; }
.vs-team small { color: var(--muted); font-size: 15px; }
.vs-badge { width: 76px; height: 76px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--g-hit); color: #fff; font: 900 26px/1 var(--font-display); box-shadow: 0 12px 30px rgba(199, 0, 11, .35), inset 0 -4px 0 rgba(0, 0, 0, .2); animation: vs-pop .7s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: .45s; }
@keyframes vs-pop { from { transform: scale(0) rotate(-40deg); opacity: 0; } }
.intro-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.mend { min-height: 100%; display: grid; place-items: center; padding: 40px 20px; text-align: center; }
.mend-inner { width: min(780px, 100%); }
.mend .brand { justify-content: center; margin-bottom: 22px; }
.mend h1 { font: 800 clamp(30px, 4.4vw, 56px)/1.08 var(--font-display); letter-spacing: -.02em; margin: 0 0 24px; animation: rise-in .6s cubic-bezier(.2, 1.2, .4, 1) both; }
.mend-score { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 34px); margin-bottom: 24px; }
.mside { display: grid; gap: 6px; min-width: 180px; padding: 16px 22px; border-radius: 18px; background: #fff; border: 1px solid var(--line); border-bottom: 5px solid var(--c); box-shadow: var(--shadow-1); }
.mside b { font: 700 18px/1.2 var(--font-display); overflow-wrap: anywhere; }
.mside span { font: 900 60px/1 var(--font-display); color: var(--c); font-variant-numeric: tabular-nums; }
.mside.win { box-shadow: 0 0 0 2px var(--c), var(--shadow-2); }
.mside.lose { opacity: .55; }
.mdash { font: 800 36px/1 var(--font-display); color: var(--faint); }
.mwords { max-width: 560px; margin: 0 auto 20px; padding: 10px 16px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-1); text-align: left; }
.mnext { color: var(--muted); font-size: 17px; margin: 0 0 24px; }
.mnext b { color: var(--ink); }
.path { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.path li { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.path-round { font: 700 13px/1.2 var(--font-display); color: var(--red); }
.path b { font: 800 16px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.pod-name + .pod-name { margin-top: 2px; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .strip-title { display: none; }
}
@media (max-width: 980px) {
  body { overflow: auto; }
  .view-play { overflow: auto; }
  .play-main { grid-template-columns: 1fr; }
  .teams { flex-direction: row; overflow-x: auto; overflow-y: visible; padding-bottom: 10px; }
  .lectern { min-width: 210px; }
  .lectern.is-on { transform: translateY(-3px); }
  .board-wrap { flex: none; height: min(56vh, 520px); }
  .console { overflow: visible; }
  .strip { flex-wrap: wrap; }
  .home { grid-template-columns: 1fr; }
  .results-grid { grid-template-columns: 1fr; }
  .qs-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .trow { grid-template-columns: 24px 30px minmax(0, 1fr) 30px 30px; }
  .trow input[data-f="teamMember"] { grid-column: 3 / 4; }
  .trow.thead { display: none; }
  .mside span { font-size: 44px; }
  .mend-score { gap: 10px; }

// Single elimination in which every round pairs as many groups as it can; with an odd number one group goes through
// without a match (25 groups: 12 matches and a bye). A bye always goes to a part of the bracket where nobody has had
// one yet, so no group gets two. The drawn order of the ids decides who meets whom.
function buildTournament(ids) {
  const n = ids.length;
  let level = Array.from({ length: Math.floor(n / 2) }, () => ({ r: 0, kids: [], one: false, taint: false }));
  if (n % 2) level.push({ r: 0, kids: [], one: true, taint: true });
  while (level.length > 1) {
    const r = level[0].r + 1, pool = level.slice(), next = [];
    let solo = null;
    if (pool.length % 2) {
      let k = -1;
      for (let x = pool.length - 1; x >= 0; x--) if (!pool[x].taint) { k = x; break; }
      solo = pool.splice(k < 0 ? pool.length - 1 : k, 1)[0];
    }
    // Parts with a bye in them meet each other first, so the parts without one stay available for the next bye.

function readLogoFile(file) {
  if (!file) return;
  if (!/^image\//.test(file.type || '')) { toast('Bir görsel dosyası seçin: PNG, JPG, SVG ya da WebP.', 'err', 3600); return; }

  rd.onload = () => {

    img.onload = () => { const out = rasterLogo(img); if (out) setLogo(out); else toast('Görsel küçültülemedi; daha küçük bir dosya deneyin.', 'err', 3600); };
    img.onerror = () => toast('Görsel açılamadı. Başka bir dosya deneyin.', 'err', 3600);

function rasterLogo(img) {
  let w = img.naturalWidth || img.width || 0, h = img.naturalHeight || img.height || 0;
  if (!w || !h) { w = 640; h = 320; }
  for (const max of [640, 480, 360, 260]) {
    const k = Math.min(1, max / Math.max(w, h)), cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const cx = cv.getContext('2d'); if (!cx) return '';
    let url = '';
    try { cx.drawImage(img, 0, 0, cw, ch); url = cv.toDataURL('image/png'); } catch (e) { return ''; }
    if (url.length > LOGO_MAX) { try { const wp = cv.toDataURL('image/webp', .9); if (wp.indexOf('data:image/webp') === 0 && wp.length < url.length) url = wp; } catch (e) {} }

    const gone = config.teams.slice(n), named = gone.filter(t => t.members.some(m => m.trim()) || !/^Grup \d+$/.test(t.name)).length;

    config.teams = config.teams.slice(0, n);
  } else for (let i = cur; i < n; i++) config.teams.push(newTeam(i));
  structural(); toast('Grup sayısı ' + n + ' oldu' + (n > cur ? '; yeni grupları katılmaları için işaretleyin' : '') + '.', 'ok', 3400);
}
function openTeamsBulk() {
  const text = config.teams.map(t => [t.name].concat(t.members.filter(m => m.trim())).join(', ')).join('\n');
  openModal('<h2>' + icon('users', 20) + ' Grupları toplu düzenle</h2><p class="muted">Her satıra bir grup yazın: önce grup adı, sonra virgülle iki yarışmacı. Satır sayısı grup sayısını belirler.</p>' +

    '<div class="modal-actions"><button class="btn" data-action="modalClose">Vazgeç</button><button class="btn btn-primary" data-action="teamsBulkApply">' + icon('check') + ' Kaydet</button></div>', { wide: true });

function applyTeamsBulk() {

function poolMissing() { toast('Hazır kelime listesi henüz yüklenmedi. Biraz sonra tekrar deneyin ya da kelimeleri kendiniz yazın.', 'warn', 3800); }

  poolDel: a => { const i = parseInt(a.dataset.r, 10), r = config.rounds[i], k = parseInt(a.dataset.k, 10); if (!r || !(k >= plannedSlots(i) && k < r.words.length)) return; r.words.splice(k, 1); persistConfig(); renderPool(i); },
  poolToggle: a => { const i = parseInt(a.dataset.r, 10); ui.openPools = ui.openPools || {}; ui.openPools[i] = !isPoolOpen(i); renderPool(i, '[data-action="poolToggle"]'); },
  poolsAll: () => { const R = tourR(), open = !allPoolsOpen(R); ui.openPools = {}; for (let i = 0; i < R; i++) ui.openPools[i] = open; renderAdmin(); },
  slotChange: a => changeSlot(parseInt(a.dataset.r, 10), parseInt(a.dataset.s, 10)),

    const mx = $('.pool[data-r="' + i + '"] .pool-mix'); if (mx) mx.innerHTML = catMixHTML(planOf(i));
  },
  teamsAll: () => { config.teams.forEach(t => { t.active = true; }); structural(); },
  teamsNone: () => { config.teams.forEach(t => { t.active = false; }); structural(); },
  resetMatch: async a => { const i = parseInt(a.dataset.i, 10); if (!roundMatches(game.r)[i]) return; if (await confirmBox(matchNo(game.r, i) + '. maçın sonucu silinsin mi? Maç yeniden oynanabilir.', 'Sonucu sil', true)) resetMatch(i); },
  buzz: a => buzz(a.dataset.team),
  next: () => nextWord(),
  undo: () => doUndo(),
  hint: () => giveHint(),
  addrow: () => addRow(),
  pass: () => passAction(),
  reveal: () => revealWord(),
  matchScore: () => openMatchScore(),
  msAdj: a => msAdj(parseInt(a.dataset.side, 10), parseInt(a.dataset.d, 10) || 0),

  tab: a => { ui.adminTab = a.dataset.tab; if (ui.view !== 'admin') go('admin'); else { const v = $('#view'); renderAdmin(); if (v) $('#view').scrollTop = 0; } },
  toggleHide: () => { ui.hideWords = !ui.hideWords; renderAdmin(); },

  poolFill: a => fillRound(parseInt(a.dataset.r, 10)),
  poolSave: a => savePool(parseInt(a.dataset.r, 10)),
  poolClear: async a => {
    const i = parseInt(a.dataset.r, 10), r = config.rounds[i]; if (!r) return;
    if (await confirmBox(cfgRoundTitle(i) + ' listesindeki ' + r.words.filter(Boolean).length + ' kelime silinsin mi?', 'Listeyi temizle', true)) { r.words = []; persistConfig(); renderPool(i); }

  },
  teamDel: async a => {
    const t = teamOfEl(a); if (!t) return;

/* ===================== Events ===================== */
document.addEventListener('pointerdown', () => Sound.unlock(), true);
document.addEventListener('click', e => {
  const keyBtn = e.target.closest('.key[data-key]');
  if (keyBtn) {
    const k = keyBtn.dataset.key;
    if (k === 'Enter') { const cur = game && game.cur; if (cur && (cur.state === 'won' || cur.state === 'revealed')) nextWord(); else submitGuess(); }
    else if (k === 'Backspace') backspace();
    else typeLetter(k);
    keyBtn.blur();
    return;
  }
  const a = e.target.closest('[data-action]');
  if (!a || a.disabled) return;
  const fn = ACTIONS[a.dataset.action]; if (!fn) return;
  e.preventDefault();
  fn(a, e);
  if (ui.view === 'play' && a.tagName === 'BUTTON' && document.activeElement === a) a.blur();
});
document.addEventListener('keydown', e => {
  Sound.unlock();
  if (modalOpen()) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    return;
  }
  const el = e.target, tag = (el && el.tagName) || '';
  if (e.key === 'Enter' && el && el.dataset) {
    if (el.dataset.f === 'poolAdd') { e.preventDefault(); addPoolWords(el); return; }
    if (el.dataset.f === 'poolWord') { e.preventDefault(); el.blur(); return; }
    if (el.dataset.f === 'slotWord') {
      e.preventDefault();
      const all = $$('input[data-f="slotWord"]:not([disabled])'), k = all.indexOf(el);
      if (k >= 0 && all[k + 1]) all[k + 1].focus(); else el.blur();
      return;
    }
  }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || (el && el.isContentEditable)) return;
  if (tag !== 'BUTTON' && el && el.id === 'clock' && (e.key === 'Enter' || e.key === ' ') && ui.view === 'play') { e.preventDefault(); ACTIONS.timer(); return; }
  if (ui.view !== 'play' || !game) return;
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); doUndo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (tag === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) e.preventDefault();
  if (ui.peekBracket) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); ui.peekBracket = false; renderPlay(); } return; }
  if (game.status === 'bracket') { if (e.key === 'Enter') { e.preventDefault(); bracketPrimary(); } return; }
  if (game.status === 'matchIntro') { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); beginMatch(); } return; }
  if (game.status === 'matchEnd') { if (e.key === 'Enter') { e.preventDefault(); backToBracket(); } return; }
  if (game.status !== 'playing') return;
  const cur = game.cur; if (!cur) return;
  if (ui.verify) {
    if (e.key === 'Escape') { e.preventDefault(); verifyFix(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); verifyReject(); }
    else if (e.key === 'k' || e.key === 'K') { e.preventDefault(); verifyAccept(); }
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (cur.state === 'won' || cur.state === 'revealed') { if (performance.now() - ui.resultAt > 600) nextWord(); }
    else submitGuess();
    return;
  }
  if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
  if (e.key === 'Escape') { cancelBuzz(); return; }
  if (/^[1-9]$/.test(e.key)) { if (cur.mode === 'buzzer') { const id = cur.order[+e.key - 1]; if (id) buzz(id); } return; }
  if (e.key.length === 1) { const ch = norm(e.key); if (ch.length === 1) { e.preventDefault(); typeLetter(ch); } }
});
document.addEventListener('input', e => {
  const el = e.target; if (!el || !el.dataset) return;
  const key = el.dataset.set;
  if (key && (el.type === 'text' || el.type === 'password')) {
    config[key] = key === 'title' || key === 'subtitle' ? el.value.slice(0, 80) : el.value.slice(0, 12);
    scheduleConfigSave(); return;
  }
  const f = el.dataset.f; if (!f) return;
  if (f === 'slotWord') {
    const v = norm(el.value);
    if (v !== el.value) { const caret = norm(el.value.slice(0, el.selectionStart == null ? el.value.length : el.selectionStart)).length; el.value = v; try { el.setSelectionRange(caret, caret); } catch (_) {} }
    const row = el.closest('.slot'); if (row) { row.classList.toggle('bad', !!v && chars(v).length !== roundLen(+el.dataset.r)); row.classList.toggle('empty', !v); }
  }
  else if (f === 'poolWord') {
    const v = norm(el.value);
    if (v !== el.value) { const caret = norm(el.value.slice(0, el.selectionStart == null ? el.value.length : el.selectionStart)).length; el.value = v; try { el.setSelectionRange(caret, caret); } catch (_) {} }
    if (el.previousElementSibling) el.previousElementSibling.textContent = v;
    const wrap = el.closest('.wchip-wrap'); if (wrap) wrap.classList.toggle('bad', !!v && chars(v).length !== roundLen(+el.dataset.r));
  }
  else if (f === 'poolAdd') {
    const up = el.value.replace(/i/g, 'İ').replace(/ı/g, 'I').toUpperCase();
    if (up !== el.value && up.length === el.value.length) { const c = el.selectionStart; el.value = up; try { el.setSelectionRange(c, c); } catch (_) {} }
  }
  else if (f === 'teamName') { const t = teamOfEl(el); if (t) { t.name = el.value.slice(0, 40); scheduleConfigSave(); scheduleMeta(); } }
  else if (f === 'teamMember') { const t = teamOfEl(el); if (t) { t.members[+el.dataset.mi] = el.value.slice(0, 40); scheduleConfigSave(); } }
});
document.addEventListener('change', e => {
  const el = e.target; if (!el) return;
  if (el.id === 'importFile') {
    const file = el.files && el.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => importJSONText(String(rd.result || ''));
    rd.onerror = () => toast('Dosya okunamadı.', 'err');
    rd.readAsText(file); el.value = ''; return;
  }
  if (el.id === 'logoFile') { readLogoFile(el.files && el.files[0]); el.value = ''; return; }
  if (el.id === 'wordsFile') { const fs = Array.from(el.files || []); el.value = ''; readWordFiles(fs); return; }
  const f = el.dataset && el.dataset.f;
  if (f === 'poolWord') { commitPoolWord(el); return; }
  if (f === 'slotWord') { commitSlot(el); return; }
  if (f === 'slot') { editSlot(parseInt(el.dataset.i, 10), parseInt(el.dataset.side, 10), el.value); return; }
  if (f === 'teamActive') {
    const t = teamOfEl(el); if (!t) return;
    t.active = el.checked; ensureRounds(config);
    const row = el.closest('.trow'); if (row) row.classList.toggle('off', !t.active);
    const info = $('#teamsInfo'); if (info) { info.innerHTML = teamsInfoHTML(); info.className = 'notice ' + (activeCountOf(config) < 2 ? 'warn' : 'info'); }
    scheduleConfigSave(); return;
  }
  if (f === 'roundTime') {
    const r = roundCfg(parseInt(el.dataset.r, 10)); let v = parseInt(el.value, 10);
    if (!Number.isFinite(v)) v = r.time;
    r.time = clamp(v, 0, 300); el.value = r.time; scheduleConfigSave(); return;
  }
  const key = el.dataset && el.dataset.set; if (!key) return;
  if (el.type === 'checkbox') config[key] = el.checked;
  else if (el.type === 'number') {
    let v = parseInt(el.value, 10);
    if (!Number.isFinite(v)) v = config[key];
    v = clamp(v, +el.min, +el.max); el.value = v; config[key] = v;
  } else return;
  scheduleConfigSave();
  const pv = $('#lenPreview'); if (pv) pv.innerHTML = lenPreviewHTML();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'pinForm') {
    const inp = $('#pinInput');
    if (inp && inp.value === config.pin) { ui.adminOk = true; ui.hideWords = gameActive() && gameStarted(); renderAdmin(); }
    else { const card = $('.pin-card'); if (card) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); } Sound.error(); if (inp) inp.select(); }
  }
});
window.addEventListener('hashchange', () => {
  if (ui.hashLock) { ui.hashLock = false; return; }
  const v = viewFromHash(); if (v !== ui.view) go(v);
});

/* ===================== Boot ===================== */
function start(data) {
  data = data || {};
  if (data.adminTab) ui.adminTab = String(data.adminTab);
  if (data.adminOk) ui.adminOk = true;
  Cloud.init(); Caps.init(); Dict.load();
  if (!local.ok) toast('Tarayıcı kaydı kapalı. Ayarlarınızı kaybetmemek için Yedekleme sekmesinden yedek alın.', 'warn', 5200);
  const w0 = data.view || viewFromHash();
  let v = ['home', 'play', 'admin'].indexOf(w0) >= 0 ? w0 : 'home';
  if (v === 'play' && !game) v = 'home';
  if (v === 'admin') ui.hideWords = gameActive() && gameStarted();
  ui.view = v; render();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ view: ui.view, adminTab: ui.adminTab, adminOk: ui.adminOk }));
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
} catch (e) { start({}); }
})();
